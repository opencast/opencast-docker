name: Send Out Release Notification

on:
  create:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up matrix-msg
        uses: lkiesow/matrix-notification@8c265f458bdd18351931b715c0735302df597d94 # v1
        with:
          room: '!RACMQVfKRDQTWhdXLa:matrix.org'
          token: ${{ secrets.MATRIX_TOKEN }}
          tool: true

      - name: announce new container images
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/heads/[0-9]+\.(x|[0-9]+)$ ]]; then
            echo "Started building Opencast $(cat VERSION) container images. They should be available in approximately 2h." | ~/.local/bin/matrix-msg
          fi
